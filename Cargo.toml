[package]
name = "iroh-rdp-tunnel"
version = "0.3.0"
edition = "2021"
description = "Minimal P2P tunnel for Windows RDP (port 3389), iroh or rustp2p backend"
license = "MIT OR Apache-2.0"

[dependencies]
iroh = { version = "1.0", features = ["unstable-net-report"] }
rustp2p-quic = "0.1.2"
portmapper = "0.19"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "signal", "sync", "time"] }
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls-pemfile = "2"

[dev-dependencies]
iroh = { version = "1.0", features = ["test-utils"] }
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
